name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:

# Права для деплоя на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Защита от параллельных деплоев
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ===== Job 1: CI — проверки и сборка =====
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      # Сохраняем dist как артефакт для job'а deploy
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # ===== Job 2: Deploy — только после успешного CI =====
  deploy:
    needs: ci                                  # ← ГЛАВНОЕ: ждём CI
    if: github.ref == 'refs/heads/main'        # ← только на push в main
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Скачиваем dist, собранный в CI — не пересобираем!
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
